<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linux Web Desktop</title>
<style>
:root{--bg:#171923;--panel:#222633;--line:#343a4c;--text:#edf0f7;--muted:#a6adbf;--accent:#82aaff;--wall:radial-gradient(ellipse at 20% 15%,#374c79 0,transparent 40%),radial-gradient(ellipse at 80% 85%,#493565 0,transparent 38%),#141824}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,sans-serif;color:var(--text);background:var(--wall);height:100vh;overflow:hidden;user-select:none}button,input{font:inherit}button{color:inherit;background:#ffffff0d;border:1px solid #ffffff1a;border-radius:6px;padding:7px 10px;cursor:pointer}button:hover{background:#ffffff20}.top{height:34px;background:#11131bdc;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:12px;backdrop-filter:blur(12px)}.top button{border:0;padding:4px 9px}.desktop{height:calc(100vh - 34px - 66px);padding:20px;display:flex;flex-direction:column;align-items:flex-start;gap:18px}.shortcut{width:82px;text-align:center;cursor:pointer;padding:8px 3px;border:1px solid transparent;border-radius:8px;font-size:12px}.shortcut:hover,.shortcut:focus{background:#ffffff18;border-color:#ffffff30}.glyph{font-size:30px;display:block;margin-bottom:5px}.dock{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:7px;background:#191c27df;border:1px solid #ffffff22;border-radius:13px;backdrop-filter:blur(18px)}.dock button{width:47px;height:45px;font-size:23px;padding:0;border:0}.window{position:absolute;top:12%;left:50%;transform:translateX(-50%);width:min(760px,92vw);height:min(510px,68vh);min-height:260px;background:#1d202af2;border:1px solid #ffffff30;border-radius:10px;box-shadow:0 22px 70px #0008;display:flex;flex-direction:column;overflow:hidden}.titlebar{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#292d3b;border-bottom:1px solid var(--line);font-weight:600;cursor:move}.controls{display:flex;gap:6px}.controls button{padding:2px 8px}.close{color:#ff8b9a}.content{padding:14px;overflow:auto;flex:1;user-select:text}.terminal{background:#101219;color:#d7e0f4;font:13px ui-monospace,SFMono-Regular,Consolas,monospace;padding:12px;white-space:pre-wrap;height:100%;overflow:auto}.termline{display:flex;gap:8px}.termline span{color:#91d7a7;white-space:nowrap}.termline input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font:inherit}.filelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}.file{padding:14px 8px;text-align:center;border-radius:7px;cursor:pointer}.file:hover{background:#ffffff12}.file b{display:block;font-size:28px;margin-bottom:7px}.settingsrow{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.settingsrow input{accent-color:var(--accent)}.browserbar{display:flex;gap:7px;margin-bottom:12px}.browserbar input{flex:1;min-width:0;background:#11141c;border:1px solid var(--line);color:var(--text);padding:8px;border-radius:6px}.muted{color:var(--muted)}.card{padding:14px;border:1px solid var(--line);border-radius:8px;margin:8px 0;background:#ffffff05}.welcome{max-width:500px;margin:6vh auto;text-align:center}.welcome h1{font-size:30px;margin-bottom:4px}.welcome p{color:var(--muted)}.hidden{display:none!important}#toast{position:absolute;bottom:85px;left:50%;transform:translateX(-50%);background:#252a39;padding:10px 16px;border:1px solid #ffffff2a;border-radius:8px;display:none}
</style>
</head>
<body>
<header class="top"><button onclick="toggleMenu()">◈ Activities</button><b id="clock">Linux Web Desktop</b><button onclick="openApp('settings')">⚙ Settings</button></header>
<main class="desktop" id="desktop">
<div class="shortcut" onclick="openApp('files')"><span class="glyph">📁</span>Files</div>
<div class="shortcut" onclick="openApp('terminal')"><span class="glyph">▣</span>Terminal</div>
<div class="shortcut" onclick="openApp('browser')"><span class="glyph">🌐</span>Web Browser</div>
<div class="shortcut" onclick="openApp('settings')"><span class="glyph">⚙</span>Settings</div>
<div class="shortcut" onclick="openApp('about')"><span class="glyph">ⓘ</span>About</div>
</main>
<div class="dock"><button title="Files" onclick="openApp('files')">📁</button><button title="Terminal" onclick="openApp('terminal')">▣</button><button title="Browser" onclick="openApp('browser')">🌐</button><button title="Settings" onclick="openApp('settings')">⚙</button><button title="About" onclick="openApp('about')">ⓘ</button></div>
<div id="windows"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);let winCount=0;const fs={
'/home/guest':['Documents','Downloads','Pictures','hello.txt','README.txt'],
'/home/guest/Documents':['notes.txt','ideas.txt'],
'/home/guest/Downloads':[],
'/home/guest/Pictures':[],
'/home/guest/hello.txt':'Welcome to Linux Web Desktop!\n\nThis is a Linux-inspired desktop simulation running entirely in your browser.',
'/home/guest/README.txt':'This is a browser-based desktop simulation, not a real Linux kernel or operating system.'
};let cwd='/home/guest';
function tick(){let d=new Date();$('#clock').textContent=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+'  '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,1000);
function toast(s){let t=$('#toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',2300)}
function toggleMenu(){openApp('menu')}
function openApp(app){if(app==='menu'){app='menu'}let id='w'+(++winCount),title={files:'Files',terminal:'Terminal',browser:'Web Browser',settings:'Settings',about:'About this desktop',menu:'Applications'}[app]||app;let w=document.createElement('section');w.className='window';w.id=id;w.style.zIndex=10+winCount;w.innerHTML='<div class="titlebar"><span>'+title+'</span><div class="controls"><button onclick="minimize(\''+id+'\')">—</button><button class="close" onclick="document.getElementById(\''+id+'\').remove()">×</button></div></div><div class="content" id="'+id+'c"></div>';$('#windows').append(w);let c=$('#'+id+'c');if(app==='terminal')terminal(c);else if(app==='files')files(c);else if(app==='settings')settings(c);else if(app==='browser')browser(c);else if(app==='about')about(c);else if(app==='menu')menu(c);drag(w);return w}
function minimize(id){document.getElementById(id).style.display='none';toast('Window minimized')}
function drag(w){let bar=w.querySelector('.titlebar'),ox,oy;bar.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;let r=w.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;bar.setPointerCapture(e.pointerId);bar.onpointermove=ev=>{w.style.left=(ev.clientX-ox+w.offsetWidth/2)+'px';w.style.top=Math.max(36,ev.clientY-oy)+'px';w.style.transform='translateX(-50%)'};bar.onpointerup=()=>{bar.onpointermove=null}})}
function terminal(c){c.style.padding='0';c.innerHTML='<div class="terminal" id="term"><div>Linux Web Desktop [browser simulation]<br>Type <b>help</b> to see commands.<br><br></div><div class="termline"><span>guest@web-linux:~$</span><input aria-label="Terminal command" autocomplete="off" spellcheck="false"></div></div>';let t=$('#term'),input=t.querySelector('input');input.focus();input.addEventListener('keydown',e=>{if(e.key!=='Enter')return;let cmd=input.value.trim(),out='';const a=cmd.split(/\s+/);if(cmd==='help')out='Available commands: help, ls, pwd, whoami, uname -a, date, clear, echo, cat, neofetch, sudo, apt, reboot';else if(cmd==='ls')out=(fs[cwd]||[]).join('  ')||'(empty directory)';else if(cmd==='pwd')out=cwd;else if(cmd==='whoami')out='guest';else if(cmd==='uname -a')out='Linux web-linux 6.x browser-simulation x86_64 GNU/Linux';else if(cmd==='date')out=new Date().toString();else if(cmd==='clear'){t.innerHTML='';}else if(a[0]==='echo')out=cmd.slice(5);else if(a[0]==='cat'){let p=a.slice(1).join(' ');out=fs[cwd+'/'+p]||fs[p]||'cat: '+p+': No such file';}else if(cmd==='neofetch')out='  /\\_/\\      guest@web-linux\n ( o.o )     OS: Linux Web Desktop\n  > ^ <      Kernel: simulated\n              Shell: web-sh\n              Browser: '+navigator.userAgent.split(' ').slice(-1)[0];else if(a[0]==='cd'){let p=a[1]||'/home/guest';cwd=p.startsWith('/')?p:cwd+'/'+p;if(!fs[cwd]){cwd=cwd.substring(0,cwd.lastIndexOf('/'));out='cd: directory not found'} }else if(cmd.startsWith('sudo'))out='This browser simulation has no real root access.';else if(a[0]==='apt')out='Package manager unavailable in the browser simulation.';else if(cmd==='reboot')out='Reboot simulated. Your browser and files remain unchanged.';else if(!cmd)out='';else out='sh: '+a[0]+': command not found';if(cmd!=='clear'){let line=document.createElement('div');line.innerHTML='<span style="color:#91d7a7">guest@web-linux:~$</span> '+esc(cmd)+'<br>'+esc(out).replace(/\n/g,'<br>');t.insertBefore(line,t.lastElementChild)}input.value='';t.scrollTop=t.scrollHeight})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function files(c){function render(){c.innerHTML='<div class="muted" style="margin-bottom:12px">Location: '+esc(cwd)+'</div><div class="filelist">'+(fs[cwd]||[]).map(n=>'<div class="file" data-name="'+esc(n)+'"><b>'+(n.includes('.')?'📄':'📁')+'</b>'+esc(n)+'</div>').join('')+'</div><div class="muted" style="margin-top:18px">Browser-only sample files</div>';c.querySelectorAll('.file').forEach(el=>el.onclick=()=>{let n=el.dataset.name;if(fs[cwd+'/'+n]&&Array.isArray(fs[cwd+'/'+n])){cwd+='/'+n;render()}else if(typeof fs[cwd+'/'+n]==='string')alert(fs[cwd+'/'+n]);else toast(n)})}render()}
function settings(c){c.innerHTML='<h2>System Settings</h2><div class="settingsrow"><div><b>Dark appearance</b><div class="muted">Change the desktop background</div></div><input type="checkbox" checked id="dark"></div><div class="settingsrow"><div><b>Accent color</b><div class="muted">Window highlight color</div></div><input type="color" value="#82aaff" id="accent"></div><div class="settingsrow"><div><b>Screen resolution</b><div class="muted">Uses your browser window size</div></div><span>'+innerWidth+' × '+innerHeight+'</span></div><div class="settingsrow"><div><b>Storage</b><div class="muted">Virtual sample files only</div></div><span>Local demo</span></div>';$('#dark').onchange=e=>{document.body.style.background=e.target.checked?'var(--wall)':'linear-gradient(135deg,#cbd5e1,#e2e8f0)';document.body.style.color=e.target.checked?'var(--text)':'#111827';toast('Appearance updated')};$('#accent').oninput=e=>document.documentElement.style.setProperty('--accent',e.target.value)}
function browser(c){c.innerHTML='<div class="browserbar"><input id="url" value="https://example.com" aria-label="Website address"><button id="go">Go</button></div><div id="webpage" class="card"><h2>Welcome to Web Browser</h2><p>This demo does not load arbitrary websites inside the app. Open a website in a new browser tab instead.</p><button id="example">Open example.com ↗</button></div><p class="muted">Tip: this desktop runs on GitHub Pages, so network access and real OS features are limited by the browser.</p>';let go=()=>{let u=$('#url').value.trim();if(!/^https?:\/\//i.test(u))u='https://'+u;window.open(u,'_blank','noopener');};$('#go').onclick=go;$('#url').onkeydown=e=>{if(e.key==='Enter')go()};$('#example').onclick=()=>window.open('https://example.com','_blank','noopener')}
function about(c){c.innerHTML='<div class="welcome"><div style="font-size:52px">🐧</div><h1>Linux Web Desktop</h1><p>A tiny Linux-inspired desktop built with HTML, CSS and JavaScript.</p><div class="card"><b>Platform</b><p>Web browser / GitHub Pages</p><b>System</b><p>Simulated desktop environment</p><b>Important</b><p>This is not a real Linux kernel. A static website cannot boot Linux or access your computer like an installed OS.</p></div><button onclick="openApp(\'terminal\')">Open Terminal</button></div>'}
function menu(c){c.innerHTML='<h2>Applications</h2><div class="filelist">'+[['📁','Files','files'],['▣','Terminal','terminal'],['🌐','Web Browser','browser'],['⚙','Settings','settings'],['ⓘ','About','about']].map(a=>'<button style="padding:18px" onclick="openApp(\''+a[2]+'\')">'+a[0]+'<br>'+a[1]+'</button>').join('')+'</div>'}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.window').forEach(w=>w.remove());if(e.ctrlKey&&e.altKey&&e.key.toLowerCase()==='t')openApp('terminal')});
</script></body></html>
